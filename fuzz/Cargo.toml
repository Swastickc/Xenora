[package]
name = "xenora-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
xenora-decoder = { path = "../crates/decoder" }
xenora-loader = { path = "../crates/loader" }
xenora-ref = { path = "../crates/ref" }
xenora-shader = { path = "../crates/shader" }

[workspace]

[[bin]]
name = "cpu_decode"
path = "fuzz_targets/cpu_decode.rs"
test = false
doc = false

[[bin]]
name = "instruction_stream"
path = "fuzz_targets/instruction_stream.rs"
test = false
doc = false

[[bin]]
name = "fixture"
path = "fuzz_targets/fixture.rs"
test = false
doc = false

[[bin]]
name = "pe_parse"
path = "fuzz_targets/pe_parse.rs"
test = false
doc = false

[[bin]]
name = "reference"
path = "fuzz_targets/reference.rs"
test = false
doc = false

[[bin]]
name = "runtime_services"
path = "fuzz_targets/runtime_services.rs"
test = false
doc = false
